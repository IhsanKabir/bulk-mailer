name: Build & Release

# Triggers:
#   - push of a tag matching v*.*.*  → builds the exe and creates a Release
#   - manual workflow_dispatch        → builds the exe (artifact only, no release)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest tests/ -q

      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm BulkMailer.spec

      - name: Verify exe was produced
        shell: pwsh
        run: |
          $exe = "dist\BulkMailer.exe"
          if (-not (Test-Path $exe)) { throw "exe not found at $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "Built $exe — $([math]::Round($size / 1MB, 1)) MB"

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulkMailer-${{ github.ref_name }}
          path: dist/BulkMailer.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BulkMailer.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
